<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoLoan Application</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#fff; color:#333; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .box { width:90%; max-width:400px; background:#fff; padding:30px 25px; border-radius:15px; text-align:center; box-shadow:0 0 20px rgba(0,0,0,0.12); border:2px solid #1565c0; }
  h1 { margin-bottom:5px; font-size:32px; letter-spacing:-1px; }
  h1 .eco { color:#1565c0; }
  h1 .loan { color:#d32f2f; }
  p { font-size:13px; color:#666; opacity:0.9; margin-bottom:20px; line-height:1.5; }
  input {
    width:90%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:2px solid #1565c0;
    outline:none;
    font-size:14px;
    color:#222;
    font-family:inherit;
  }
  input:focus { border-color:#0d47a1; box-shadow:0 0 0 3px rgba(21,101,192,0.18); }
  button {
    width:95%;
    padding:14px;
    margin-top:10px;
    background:#1565c0;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
    color:#fff;
  }
  button:hover { background:#0d47a1; }
  button:disabled { background:#999; cursor:not-allowed; }
  .msg { display:none; margin-top:14px; color:#1565c0; font-size:13px; line-height:1.5; font-weight:600; }
</style>
</head>
<body>
<div class="box">
  <h1><span class="eco">Eco</span><span class="loan">Loan</span></h1>
  <p>Fast Loans &bull; Simple Process &bull; Instant Response</p>
  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number">
  <input id="email" placeholder="Email Address">
  <input id="usage" placeholder="Loan Usage (e.g. Business, School Fees)">
  <button id="submitBtn" onclick="submitForm()">Submit Application</button>
  <div class="msg" id="msg"></div>
</div>
<script>
async function submitForm() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const usage = document.getElementById("usage").value.trim();
  if (!name || !phone || !email || !usage) { alert("Please fill in all fields."); return; }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerText = "Submitting...";
  try {
    const response = await fetch("https://ecoloan-bot-v2-production.up.railway.app/website-lead", {
      method: "POST ",
      headers:{ "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, phone: phone, email: email, amount: "Not specified", message: usage })
    });
    if (response.ok) {
      const result = await response.json();
      const msgEl = document.getElementById("msg");
      msgEl.innerText = result.message;
      msgEl.style.display = "block";
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("email").value = "";
      document.getElementById("usage").value = "";
    } else {
      alert("Submission failed. Please try again.");
    }
  } catch(e) {
    alert("Cannot connect to server. Please try again later.");
  } finally {
    btn.disabled = false;
    btn.innerText = "Submit Application";
  }
}
</script>
</body>
</html>
